<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Alexander de Jong — Computer Engineering</title>
  <desc id="desc">Computer Engineering · UPC Barcelona</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b7bdc7"/>
    </linearGradient>
    <radialGradient id="reflection">
      <stop stop-color="#becbdd" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#8496b5" stop-opacity=".06"/>
      <stop offset="1" stop-color="#8496b5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon">
      <stop stop-color="#b7c5d9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#dce4f0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#b7c5d9" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="280" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="#08090b"/>
    <ellipse cx="600" cy="310" rx="520" ry="155" fill="url(#reflection)"/>
    <path d="M160 280Q600 220 1040 280" fill="none" stroke="url(#horizon)" stroke-width="1"/>
    <text x="600" y="132" text-anchor="middle" fill="url(#silver)" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="300" letter-spacing="-1.8">Alexander de Jong</text>
    <text x="600" y="174" text-anchor="middle" fill="#9097a2" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" letter-spacing=".4">Computer Engineering · UPC Barcelona</text>
  </g>
</svg>
